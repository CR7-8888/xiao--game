<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>国际跳蛋</title>
    <style>
    /* 【改】响应式布局：画布内部固定 520x600，靠 CSS 自适应缩放适配各种屏幕 */
    body {
        margin: 0;
        padding: 0;
        background: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
    }
    #gameCanvas {
        display: block;
        background: #000;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        touch-action: none;
        cursor: pointer;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="520" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// ==========画布设置（【改】逻辑坐标 520x600 固定，显示尺寸等比缩放，物理像素按 DPR 高清）==========
const GAME_W = 520;                    // 游戏逻辑宽度（所有绘制坐标都基于它）
const GAME_H = 600;                    // 游戏逻辑高度
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  // 显示区域上限：90vw x 85vh，再受最大尺寸限制
  const maxW = Math.min(window.innerWidth * 0.9, 900);
  const maxH = Math.min(window.innerHeight * 0.85, 700);
  // 【关键】按 520:600 等比缩放，取能放下的最大尺寸，保证图形不变形
  const scaleFit = Math.min(maxW / GAME_W, maxH / GAME_H);
  const cssW = GAME_W * scaleFit;
  const cssH = GAME_H * scaleFit;
  // 用 CSS 控制显示尺寸
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  // 物理像素 = 显示尺寸 × 像素比，保证高清不糊
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  // 把逻辑坐标 520x600 等比映射到实际画布，之后所有绘制都用逻辑坐标
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const k = canvas.width / GAME_W;     // 等比，x/y 同一个系数
  ctx.scale(k, k);
}
setupCanvas();

// ==========全局变量==========
let player = {
  x: 180,
  y: 300,
  w: 104,         // 【改】80 → 104：之前太小，脸在 520 宽的画布里缩成一团糊，放大后五官看得清
  h: 92,          // 【改】70 → 92：跟着放大，保持蛋的圆润比例（宽高比约 1.13，略扁的蛋）
  vx: 0,
  vy: 0,
  onGround: false,
  standingBlock: null // 【改】当前踩着的方块
};

let blocks = [];
let particles = [];
let floatingTexts = [];
let score = 0;
let combo = 0;
let power = 0;
let isPress = false;
let pressTime = 0;
let cameraX = 0;
let lastBlockId = -1; // 【修】上次落脚的方块唯一 id（以前存数组下标，裁剪后下标会漂移，所以改成 id）
let blockSeq = 0;     // 【修】方块自增序号：每生成一块 +1，作为它的唯一 id
let highScore = Number(localStorage.getItem("chess_jump_high") || 0); // 【新】最高分

// ==========【金币】TOKEN 金币玩法状态 ==========
let coins = [];       // 【金币】金币数组，元素 {id, x, y, bY, blockId, collected, phase}
let coinSeq = 0;      // 【金币】金币自增 id（供调试/去重用）
let coinCount = Number(localStorage.getItem("chess_jump_coins") || 0); // 【金币】跨局累计总数（持久化）
let coinCountRun = 0; // 【金币】本局收集数（initGame 清零）
const COIN_RADIUS = 20;      // 【金币】拾取判定半径（逻辑坐标，约等于金币贴图显示半径）
const COIN_SIZE = 32;        // 【金币】金币绘制边长（96px 贴图缩到 32px 显示，2 倍+ 高清余量）
const COIN_CHANCE = 0.40;    // 【金币】新方块上方挂金币的概率（40%）
const COIN_HOVER = 66;       // 【金币】金币中心悬在方块顶面上方的高度（px）

// 命中检测：判断一个逻辑坐标点 (px,py) 是否落在按钮矩形 b 内
function hitButton(b, px, py) {
  if (!b) return false;
  return px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h;
}

// ==========【改】背景音乐变量（BGM 相关的函数和变量在下方 BGM 区统一定义）==========

// ==========生成方块==========
function createBlock(baseX) {
  let w = 90 + Math.random() * 70;
  let type = Math.random() < 0.25 ? "move" : "normal";
  const blk = {
    id: ++blockSeq, // 【修】唯一 id（从 1 开始），用来判断「是不是同一块」，不随裁剪漂移
    x: baseX,
    y: 380,
    w: w,
    h: 40,
    type: type,
    moveSpeed: type === "move" ? 0.7 : 0,
    moveRange: 110,
    originX: baseX,
    direction: 1
  };
  // 【金币】新方块建好后，按概率在它上方挂一枚金币
  // 【金币】id===1 是起点方块，玩家一开局就站在上面，白送太廉价 —— 跳过不放
  if (blk.id !== 1 && Math.random() < COIN_CHANCE) {
    spawnCoinForBlock(blk);
  }
  return blk;
}

// 【金币】给指定方块上方挂一枚金币（骑在方块上方 66px 的空中，跳跃弧线经过的高度）
// 【金币】blockId 只是「出生关联」，金币的存亡由自己在 update 里独立判定（见 C），不依赖方块
function spawnCoinForBlock(b) {
  const cx = b.x + b.w / 2;          // 【金币】金币中心 x = 方块水平中心
  const by = b.y - COIN_HOVER;       // 【金币】baseY：金币中心基准 y（悬在方块顶面上方）
  coins.push({
    id: ++coinSeq,
    x: cx,
    y: by,                           // 【金币】当前显示 y（每帧由 bY 算浮动，不自己累加，防漂移）
    bY: by,                          // 【金币】浮动基准 y（固定不动）
    blockId: b.id,                   // 【金币】出生时所属方块 id
    collected: false,                // 【金币】是否已被拾取
    phase: Math.random() * Math.PI * 2 // 【金币】随机初相位，让多枚金币浮动/自转不同步
  });
}

// ==========绘制背景：渐变+城堡+棋盘地面+星光==========
function drawBackground() {
  let gradient = ctx.createLinearGradient(0, 0, 0, GAME_H);
  gradient.addColorStop(0, "#101540");
  gradient.addColorStop(1, "#1f2a75");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  drawCastle();
  drawChessFloor();
  drawMagicDots();
}

//城堡剪影（【改】平铺循环，镜头往前不消失）
function drawCastle() {
  ctx.save();
  const period = 800;
  const offset = (cameraX * 0.2) % period;
  ctx.translate(-offset, 0);
  for (let base = -period; base < GAME_W + period; base += period) {
    ctx.save();
    ctx.translate(base, 0);
    drawCastleUnit();
    ctx.restore();
  }
  ctx.restore();
}
function drawCastleUnit() {
  ctx.fillStyle = "#0b1030";
  ctx.beginPath();
  ctx.moveTo(0, 420);
  ctx.lineTo(90, 340);
  ctx.lineTo(140, 380);
  ctx.lineTo(200, 300);
  ctx.lineTo(260, 370);
  ctx.lineTo(320, 320);
  ctx.lineTo(400, 400);
  ctx.lineTo(460, 360);
  ctx.lineTo(540, 410);
  ctx.lineTo(620, 330);
  ctx.lineTo(700, 390);
  ctx.lineTo(800, 420);
  ctx.closePath();
  ctx.fill();
  drawTower(60, 340, 50, 80);
  drawTower(180, 300, 46, 100);
  drawTower(300, 320, 54, 90);
  drawTower(500, 360, 48, 76);
  drawTower(640, 330, 52, 96);
}
function drawTower(x, y, w, h) {
  ctx.fillStyle = "#141a4a";
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = "#1b2460";
  for (let i = 0; i < 4; i++) {
    ctx.fillRect(x + i * 14, y - 10, 10, 14);
  }
  ctx.fillStyle = "#ffd54a";
  ctx.fillRect(x + w / 2 - 4, y + 20, 8, 14);
}

//棋盘地面
function drawChessFloor() {
  ctx.save();
  ctx.translate(-cameraX * 0.5, 0);
  let tileSize = 40;
  let startX = Math.floor(cameraX / tileSize) * tileSize - tileSize;
  for (let x = startX; x < startX + GAME_W + tileSize * 3; x += tileSize) {
    let color = ((x / tileSize) % 2 === 0) ? "#263270" : "#2f4099";
    ctx.fillStyle = color;
    ctx.fillRect(x, 430, tileSize, GAME_H - 430);
  }
  ctx.restore();
}

//星光光点（【改】随镜头无限滚动）
function drawMagicDots() {
  ctx.save();
  const span = GAME_W + 200;
  for (let i = 0; i < 40; i++) {
    let x = ((i * 73 + performance.now() * 0.02 - cameraX * 0.1) % span + span) % span;
    let y = (i * 47) % 300;
    let alpha = 0.4 + 0.4 * Math.sin(performance.now() * 0.003 + i);
    ctx.fillStyle = `rgba(255, 230, 120, ${alpha})`;
    ctx.beginPath();
    ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

//绘制方块石台
function drawBlock(b) {
  ctx.save();
  ctx.translate(-cameraX, 0);
  //阴影
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.fillRect(b.x + 4, b.y + 4, b.w, b.h);
  //主体渐变
  if (b.type === "move") {
    let grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, "#b537f2");
    grad.addColorStop(1, "#6a0fad");
    ctx.fillStyle = grad;
  } else {
    let grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, "#8be265");
    grad.addColorStop(1, "#3fa34d");
    ctx.fillStyle = grad;
  }
  ctx.fillRect(b.x, b.y, b.w, b.h);
  //方块棋盘格花纹（【改】裁剪到方块内，不溢出底部）
  ctx.fillStyle = "rgba(255,255,255,0.22)";
  let tile = 18;
  for (let i = 0; i < b.w; i += tile) {
    for (let j = 0; j < b.h; j += tile) {
      if (((i / tile) + (j / tile)) % 2 === 0) {
        ctx.fillRect(b.x + i, b.y + j, Math.min(tile, b.w - i), Math.min(tile, b.h - j));
      }
    }
  }
  //顶部高光
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fillRect(b.x, b.y, b.w, 5);
  ctx.restore();
}

//绘制主角（【改】图片优先；没加载出来才回退手绘骑士）
// 【改】加入「伪立体」效果：投影 + 厚度偏移 + 边缘光 + 顶部高光
function drawPlayer() {
  let x = player.x;
  let y = player.y;
  let w = player.w;
  let h = player.h;
  const cx = x + w / 2;   // 角色中心 X
  const cy = y + h / 2;   // 角色中心 Y

  ctx.save();
  ctx.translate(-cameraX, 0);

  // ---------- 脚下投影 ----------
  // 位置在角色底部（y+h），不是中心，这样才像踩在方块上
  // 双层椭圆：外圈更淡更大（软边缘），内圈更实（落地核心）
  ctx.fillStyle = "rgba(0,0,0,0.16)";
  ctx.beginPath();
  ctx.ellipse(cx, y + h + 3, w / 1.9, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.26)";
  ctx.beginPath();
  ctx.ellipse(cx, y + h + 2, w / 2.7, 6.5, 0, 0, Math.PI * 2);
  ctx.fill();

  // 【改】图片可用 → 画带立体感的角色；否则走手绘保底
  if (spriteOK && playerSprite.complete && playerSprite.naturalWidth > 0) {
    const iw = playerSprite.naturalWidth;
    const ih = playerSprite.naturalHeight;
    // 主角贴图是方形（头特写），铺满整个 w×h 框，底部 y+h 落在方块顶面
    const dh = h;
    const dw = w;
    const dx = x;
    const dy = y;

    // ---------- 1. 轮廓描边 ----------
    // 【改】主角从「蛋」换成「女仆头特写」后，蛋壳那一套（evenodd 空心圆环、
    //      椭圆壳缘描边、壳面弧形高光）全部移除 —— 女仆不是蛋，套壳会穿帮。
    //      但用户要求的「轮廓描边」保留，做法改成**贴人物真实外形**：
    //      把角色图压成纯黑剪影，在 8 个方向各偏移 1~2px 画一遍，
    //      这些黑剪影从主体边缘露出来，就形成一圈贴合轮廓的深色勾边。
    //      —— 比画几何椭圆好，因为椭圆和人物轮廓对不上，会露一圈假边。
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.filter = "brightness(0)";        // 把彩色图压成黑剪影（保留 alpha）
    const outlinePts = [
      [-1.7, 0], [1.7, 0], [0, -1.7], [0, 1.7],
      [-1.2, -1.2], [1.2, -1.2], [-1.2, 1.2], [1.2, 1.2]
    ];
    for (let k = 0; k < outlinePts.length; k++) {
      ctx.drawImage(playerSprite, dx + outlinePts[k][0], dy + outlinePts[k][1], dw, dh);
    }
    ctx.restore();

    // ---------- 2. 伪立体厚度 ----------
    // 再画一层压暗的图，往右下偏移 2px，做出「有厚度」的错觉。
    ctx.save();
    ctx.filter = "brightness(0.4)";
    ctx.drawImage(playerSprite, dx + 2, dy + 1.5, dw, dh);
    ctx.restore();

    // ---------- 3. 主体角色图 ----------
    ctx.drawImage(playerSprite, dx, dy, dw, dh);

    // ---------- 4. 边缘光 ----------
    // screen 混合 + 模糊，让角色边缘透出一圈光晕，像立牌被灯打亮
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    ctx.globalAlpha = 0.22;
    ctx.filter = "blur(3px)";
    ctx.drawImage(playerSprite, dx, dy, dw, dh);
    ctx.restore();

    // ---------- 5. 发丝边缘光（左上）----------
    // 【改】原来是「头顶高光」——在蛋壳上那是壳顶反光，很合理；
    //      但主角换成头特写后，在脸/发上涂一团白只会糊成一片。
    //      改成**左上边缘光**：只在角色左上边缘透出一层冷调亮边，
    //      模拟主光从左上来，让头发和头巾有体积感。
    //      做法：把角色图整体偏移一点、只保留左上轮廓，用 lighter 叠加。
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.16;
    ctx.filter = "brightness(1.6) blur(2px)";
    ctx.drawImage(playerSprite, dx - 1.2, dy - 1.2, dw, dh);
    ctx.restore();

    // ---------- 6. 底部接触阴影 ----------
    // 在角色底部压一道横向暗，让它看起来"坐"在方块上而不是浮空
    // 用 source-atop 限制在角色像素内，不会画到背景上
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";
    const contact = ctx.createLinearGradient(0, y + h * 0.80, 0, y + h);
    contact.addColorStop(0, "rgba(40, 60, 110, 0)");
    contact.addColorStop(1, "rgba(40, 60, 110, 0.28)");
    ctx.fillStyle = contact;
    ctx.fillRect(x, y + h * 0.80, w, h * 0.20);
    ctx.restore();

    ctx.restore();
    return;
  }

  // ===== 以下为手绘骑士的保底实现（图片加载失败时才会走到这里）=====
  ctx.fillStyle = "#222";
  ctx.fillRect(x + 6, y + h - 10, w - 12, 10);
  ctx.fillStyle = "#eeeeee";
  ctx.beginPath();
  ctx.moveTo(x + 10, y + h - 10);
  ctx.lineTo(x + 8, y + 22);
  ctx.lineTo(x + 14, y + 10);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w - 14, y + 10);
  ctx.lineTo(x + w - 8, y + 22);
  ctx.lineTo(x + w - 10, y + h - 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#333";
  ctx.fillRect(x + w / 2 - 5, y + 14, 10, 4);
  ctx.fillRect(x + w / 2 - 2, y + 6, 4, 6);
  ctx.strokeStyle = "#ffd54a";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + 10, y + h - 10);
  ctx.lineTo(x + 8, y + 22);
  ctx.lineTo(x + 14, y + 10);
  ctx.lineTo(x + w / 2, y);
  ctx.lineTo(x + w - 14, y + 10);
  ctx.lineTo(x + w - 8, y + 22);
  ctx.lineTo(x + w - 10, y + h - 10);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

//粒子生成
function addParticles(x, y) {
  for (let i = 0; i < 14; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 5 - 1,
      life: 40,
      color: Math.random() < 0.5 ? "#ffd54a" : "#8be265"
    });
  }
}
// 【金币】金币拾取的爆发粒子（金色系，和 addParticles 的绿/黄区分开，且不改动原函数内部）
function addCoinBurst(x, y) {
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 4.5;
    particles.push({
      x: x, y: y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 2,       // 【金币】整体略向上飘，像金币被"吸"起来
      life: 34,
      color: Math.random() < 0.6 ? "#ffe082" : "#ffc107"  // 【金币】浅金 + 深金
    });
  }
}
//飘字
function addFloatingText(text, x, y) {
  floatingTexts.push({ text: text, x: x, y: y, life: 50 });
}
//绘制粒子
function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.25;
    p.life--;
    ctx.save();
    ctx.translate(-cameraX, 0);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    ctx.restore();
    if (p.life <= 0) particles.splice(i, 1);
  }
}
// 【金币】绘制金币（世界物体）：
//   - 必须 translate(-cameraX,0)，否则会跟背景/方块错位
//   - 自转用「横向缩放」模拟 3D 翻转：scaleX = cos(t*0.005 + phase)，最窄 0.25
//   - 上下浮动在 update() 里算好写进 c.y，这里只负责画
//   - 用 coinSpriteOK + complete + naturalWidth 三重保护，图没好就整段跳过（不报错不白屏）
function drawCoins() {
  if (!coinSpriteOK || !coinSprite.complete || coinSprite.naturalWidth <= 0) return;
  const t = performance.now();
  ctx.save();
  ctx.translate(-cameraX, 0);
  for (let i = 0; i < coins.length; i++) {
    const c = coins[i];
    if (c.collected) continue;
    // 【金币】c.y 已由 update 写成「bY + 浮动」，这里直接用
    let half = COIN_SIZE / 2;
    let sx = Math.cos(t * 0.005 + c.phase);
    // 【金币】横向缩放取绝对值，最窄压到 0.25（不做成负宽度，避免翻面时闪成一条线）
    sx = Math.sign(sx || 1) * Math.max(0.25, Math.abs(sx));
    ctx.save();
    ctx.translate(c.x, c.y);           // 【金币】平移到金币中心
    ctx.scale(sx, 1);                  // 【金币】横向压扁 = 自转的 3D 错觉
    // 【金币】地面投影（收在金币正下方一点，让它"悬空"有体积感）
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.ellipse(0, half + 6, half * 0.7, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // 【金币】主体贴图（居中绘制：中心对齐 c.x/c.y）
    ctx.drawImage(coinSprite, -half, -half, COIN_SIZE, COIN_SIZE);
    ctx.restore();
  }
  ctx.restore();
}

//绘制飘字
function drawFloatingTexts() {
  ctx.save();
  ctx.translate(-cameraX, 0);
  ctx.font = "bold 18px Arial";
  ctx.fillStyle = "#ffd54a";
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 3;
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let t = floatingTexts[i];
    t.y -= 1;
    t.life--;
    ctx.globalAlpha = t.life / 50;
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillText(t.text, t.x, t.y);
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
  ctx.restore();
}

// ==========【改】音频引擎：Web Audio API 现场合成（BGM + 音效）==========
// 【为什么不用外链文件】外链 .ogg/.mp3 有三个硬伤：
//   ① 必须和 html 放同一目录 → 破坏「单文件双击即玩」（主角图是 base64 内嵌的）
//   ② file:// 协议下浏览器经常静默拦截本地媒体，不报错也不出声
//   ③ 文件一旦丢失/改名，音乐就没了
// 现场合成零依赖、不会 404、不会失效，是单文件游戏最稳的方案。

// -------- 音频上下文 --------
// 【重要】浏览器自动播放策略：AudioContext 必须在**用户交互回调里**才能创建/resume。
//         所以这里懒创建，由 pressStart() 第一次点击时唤醒。
let audioCtx = null;
let sfxGain = null;    // 音效总线（音量独立于 BGM）
let bgmGain = null;    // BGM 总线
let bgmEnabled = localStorage.getItem("chess_jump_mute") !== "1"; // 静音开关持久化，默认开启

// 确保音频上下文可用。返回 null 表示浏览器不支持（静默放弃，不影响游戏）
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
    // 两条独立总线，方便分别调音量 / 静音
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.5 * masterVolume;   // 音效总线（乘用户音量）
    sfxGain.connect(audioCtx.destination);
    bgmGain = audioCtx.createGain();
    bgmGain.gain.value = 0.16 * masterVolume;  // BGM 总线（刻意压小，不盖过音效）
    bgmGain.connect(audioCtx.destination);
  }
  // 用户切走标签页再切回来，上下文可能被系统挂起，这里唤醒
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

// -------- 通用发声单元 --------
// 一个振荡器 + 一条包络。type: "square"/"sine"/"triangle"/"sawtooth"
// f0→f1 做频率滑音（f1 省略则不滑）
function tone(opts) {
  if (!audioCtx) return;
  const {
    freq, freq2 = null, dur = 0.1, type = "square",
    vol = 0.3, delay = 0, bus = sfxGain
  } = opts;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (freq2 !== null) {
    // 指数滑音（音高连续变化，像 "咻——" 或 "咚↓"）
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, freq2), t0 + dur);
  }
  // 包络：极短淡入（防爆音）→ 指数衰减到近零
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  g.connect(bus);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

// 白噪声（用于落地"沙"声、失败"唰"声）
function noise(opts) {
  if (!audioCtx) return;
  const { dur = 0.12, vol = 0.2, delay = 0, lp = 1800, bus = sfxGain } = opts;
  const t0 = audioCtx.currentTime + delay;
  const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const filt = audioCtx.createBiquadFilter();
  filt.type = "lowpass";
  filt.frequency.value = lp;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filt);
  filt.connect(g);
  g.connect(bus);
  src.start(t0);
  src.stop(t0 + dur + 0.02);
}

// ========== 音效（全部现场合成，无外部文件）==========

// 蓄力音：随着力度增大，音高逐渐升高（用持续振荡器 + 实时改频率）
let chargeOsc = null, chargeGain = null;
function sfxChargeStart() {
  if (!audioCtx) return;
  sfxChargeStop();                          // 防重复
  chargeOsc = audioCtx.createOscillator();
  chargeGain = audioCtx.createGain();
  chargeOsc.type = "triangle";
  chargeOsc.frequency.setValueAtTime(180, audioCtx.currentTime);
  chargeGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  chargeGain.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.05);
  chargeOsc.connect(chargeGain);
  chargeGain.connect(sfxGain);
  chargeOsc.start();
}
// 蓄力中：把音高从 180Hz 线性推到 640Hz（p 是 0~1 的力度）
function sfxChargeUpdate(p) {
  if (!chargeOsc || !audioCtx) return;
  const f = 180 + 460 * Math.max(0, Math.min(1, p));
  chargeOsc.frequency.setTargetAtTime(f, audioCtx.currentTime, 0.02);
}
function sfxChargeStop() {
  if (chargeOsc && chargeGain && audioCtx) {
    const t = audioCtx.currentTime;
    chargeGain.gain.cancelScheduledValues(t);
    chargeGain.gain.setValueAtTime(chargeGain.gain.value, t);
    chargeGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    chargeOsc.stop(t + 0.06);
  }
  chargeOsc = null;
  chargeGain = null;
}

// 起跳音：短促上滑的方波（"啾↑"），力度越大音越高
function sfxJump(p) {
  const base = 320 + p * 220;
  tone({ freq: base, freq2: base * 1.9, dur: 0.13, type: "square", vol: 0.22 });
  tone({ freq: base * 2, freq2: base * 3.4, dur: 0.10, type: "square", vol: 0.09, delay: 0.008 });
}

// 落地音：低频"咚" + 一点白噪声（踩实的质感）
function sfxLand() {
  tone({ freq: 180, freq2: 70, dur: 0.12, type: "sine", vol: 0.30 });
  noise({ dur: 0.07, vol: 0.10, lp: 900 });
}

// 加分的清脆"叮"：音高随连击数递增（连击越高越亢奋）
function sfxScore(combo) {
  const steps = [0, 2, 4, 7, 9, 11, 12, 14];   // 大调音阶（半音偏移）
  const idx = Math.min(combo, steps.length - 1);
  const freq = 880 * Math.pow(2, steps[idx] / 12);   // 从 A5 起
  tone({ freq: freq, dur: 0.11, type: "sine", vol: 0.26 });
  tone({ freq: freq * 2, dur: 0.09, type: "sine", vol: 0.10, delay: 0.012 });
}

// 【金币】金币拾取音：经典「叮↑」双音（方波 B5→E6 上滑 + 高八度正弦点缀），清脆有金属感
// 【金币】用现有 tone() 单元，bus 走 sfx，音量 <=0.22 不盖过其他音效
function sfxCoin() {
  tone({ freq: 987.77, freq2: 1318.51, dur: 0.08, type: "square", vol: 0.20 });       // 【金币】B5→E6 上滑
  tone({ freq: 1975.53, freq2: 2637.02, dur: 0.07, type: "sine", vol: 0.08, delay: 0.01 }); // 【金币】高八度亮片
}

// 连击中断：一声下行"哔——"（扫兴）
function sfxComboBreak() {
  tone({ freq: 420, freq2: 180, dur: 0.22, type: "sawtooth", vol: 0.14 });
}

// 失败（掉下去）：下行琶音 + 白噪声
function sfxFail() {
  const notes = [523.25, 440.00, 349.23, 261.63];   // C5 A4 F4 C4 逐级下坠
  notes.forEach((f, i) => {
    tone({ freq: f, dur: 0.16, type: "square", vol: 0.18, delay: i * 0.09 });
  });
  noise({ dur: 0.32, vol: 0.14, lp: 1400, delay: 0.30 });
}

// 重新开始：上行三音（"叮咚叮↑"，让人有重新开始的劲）
function sfxRestart() {
  const notes = [392.00, 523.25, 659.26];          // G4 C5 E5
  notes.forEach((f, i) => {
    tone({ freq: f, dur: 0.12, type: "triangle", vol: 0.20, delay: i * 0.07 });
  });
}

// ==========【新】切后台 / 失焦 自动暂停 BGM ==========
// 【为什么需要】用户切到别的标签页或最小化窗口时，如果音乐还在响会很突兀；
//   而且浏览器对后台标签页的定时器有节流，setTimeout 会被拉长到 1s+，
//   导致调度器排音错乱、回来时音乐卡顿。所以切走就停，切回来再恢复。
let bgmPausedByHide = false;      // 记录「是不是被切后台暂停的」，避免手动静音被误恢复

function handleVisibilityChange() {
  if (document.hidden) {
    // 切走：停 BGM + 掐掉正在响的蓄力音
    // 【注意】bgmPausedByHide 要「或」上当前状态，不能只在 if 里赋值 ——
    //        否则连续两次 visibilitychange（部分浏览器会连发）会把标记冲掉。
    if (bgmTimerId !== null) {
      bgmPausedByHide = true;
      stopBGM();
    }
    sfxChargeStop();
    isPress = false;              // 切走时松手收不到 mouseup，这里主动取消蓄力防止卡住
  } else {
    // 切回：只有在「之前是开着音乐」且「现在没静音」时才恢复
    if (bgmPausedByHide && bgmEnabled) {
      startBGM();
    }
    bgmPausedByHide = false;
  }
}
document.addEventListener("visibilitychange", handleVisibilityChange);

// 窗口失焦（点到别的程序）也暂停一下
window.addEventListener("blur", () => {
  if (bgmTimerId !== null) {
    bgmPausedByHide = true;
    stopBGM();
  }
  sfxChargeStop();
  isPress = false;                // 失焦时收回蓄力，避免回来还在充能
});
window.addEventListener("focus", () => {
  if (bgmPausedByHide && bgmEnabled) startBGM();
  bgmPausedByHide = false;
});

// ========== BGM：马里奥「地上」主题（现场合成循环）==========
// 参考原曲旋律走向，C 大调，方波 = 8-bit 红白机音色。
// 音阶表（C4 起，含半音，覆盖旋律需要的全部音高）
const BGM_SCALE = [
  261.63, 277.18, 293.66, 311.13, 329.63, 349.23,   // C4 C#4 D4 D#4 E4 F4
  392.00, 415.30, 440.00, 466.16, 493.88,            // F#4 G4 G#4 A4 A#4
  523.25, 554.37, 587.33, 622.25, 659.26, 698.46,   // C5 C#5 D5 D#5 E5 F5
  783.99, 830.61, 880.00, 932.33, 987.77             // F#5 G5 G#5 A5 A#5
];
// 音名 → 半音下标（写旋律不用手算数字）
const N = {
  // 【修】原来从 AS4:10 直接跳到 C5:12，**漏了 B4:11** —— 而旋律里用了 N.B4，
  //      结果是 undefined → BGM_SCALE[undefined] → 传进振荡器频率会变 NaN，那一拍直接哑掉。
  C4: 0, CS4: 1, D4: 2, DS4: 3, E4: 4, F4: 5, FS4: 6, G4: 7, GS4: 8, A4: 9, AS4: 10, B4: 11,
  C5: 12, CS5: 13, D5: 14, DS5: 15, E5: 16, F5: 17, FS5: 18, G5: 19, GS5: 20, A5: 21, AS5: 22
};
// 32 个十六分音符 = 一个循环（-1 = 休止符）
const BGM_MELODY = [
  N.E5, N.E5, N.E5, N.C5, N.E5, N.G5, -1, -1,
  N.C5, N.G4, N.E4, N.A4, N.B4, N.AS4, N.A4, N.G4,
  N.E5, N.G5, N.A5, N.F5, N.G5, N.E5, N.C5, N.D5,
  N.B4, -1, -1, -1, -1, -1, -1, -1
];
// 低音线（每 4 个十六分音符一个根音），让音乐有底盘
const BGM_BASS = [N.C4, N.C4, N.G4, N.G4, N.C4, N.C4, N.G4, N.G4];
const BGM_STEP_DUR = 0.19;    // 十六分音符时长（约 158 BPM，接近原曲的小跑感）
const BGM_VOLUME = 0.30;      // 相对音量（总线已压到 0.16，这里给足动态）

let bgmTimerId = null;        // 调度定时器
let bgmNextTime = 0;          // 下一个音符的绝对时间
let bgmStep = 0;              // 当前走到旋律第几个音

// BGM 专用发声：主音 + 低八度贝斯
function bgmPlayNote(freq, startTime, duration, vol, type) {
  if (!audioCtx) return;
  // 【防御】freq 不是有限正数就直接跳过（音名映射漏了某个音、或旋律表写错时，
  //        这里能保证「顶多少响一拍」，而不是把 NaN 传进振荡器导致整条 BGM 崩掉）
  if (!isFinite(freq) || freq <= 0) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(vol, startTime + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration * 0.98);
  osc.connect(g);
  g.connect(bgmGain);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}

// 调度器：提前排好未来 0.3 秒内的音符（防 setTimeout 抖动造成断音）
function bgmScheduler() {
  if (!audioCtx || !bgmEnabled) return;
  while (bgmNextTime < audioCtx.currentTime + 0.3) {
    const noteIdx = BGM_MELODY[bgmStep % BGM_MELODY.length];
    if (noteIdx >= 0) {
      bgmPlayNote(BGM_SCALE[noteIdx], bgmNextTime, BGM_STEP_DUR * 0.92, BGM_VOLUME, "square");
    }
    // 低音：每 4 个十六分音符换一次根音
    if (bgmStep % 4 === 0) {
      const bassIdx = BGM_BASS[(bgmStep / 4) % BGM_BASS.length];
      bgmPlayNote(BGM_SCALE[bassIdx] / 2, bgmNextTime, BGM_STEP_DUR * 3.6, BGM_VOLUME * 0.55, "triangle");
    }
    bgmNextTime += BGM_STEP_DUR;
    bgmStep++;
  }
  bgmTimerId = setTimeout(bgmScheduler, 120);
}

function startBGM() {
  if (!ensureAudio() || !bgmEnabled) return;
  if (bgmTimerId !== null) return;                 // 已在播，别重复起
  bgmNextTime = audioCtx.currentTime + 0.06;
  bgmScheduler();
}
function stopBGM() {
  if (bgmTimerId !== null) {
    clearTimeout(bgmTimerId);
    bgmTimerId = null;
  }
}
// 兼容旧调用名
function playBGM() { startBGM(); }
function pauseBGM() { stopBGM(); }

// 【新】把 masterVolume 应用到两条总线上（拖音量条时实时调用）
function applyVolume() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  if (sfxGain) sfxGain.gain.setTargetAtTime(0.5 * masterVolume, t, 0.01);
  if (bgmGain) bgmGain.gain.setTargetAtTime(0.16 * masterVolume, t, 0.01);
}

// 【新】手机震动反馈（只在支持的设备上生效，桌面浏览器静默忽略）
function vibrate(pattern) {
  if (navigator.vibrate) {
    try { navigator.vibrate(pattern); } catch (e) { /* 忽略：部分浏览器需用户授权 */ }
  }
}

// 【新】按钮点击音（所有 UI 按钮共用一个轻脆的短音）
function sfxClick() {
  tone({ freq: 1200, freq2: 800, dur: 0.05, type: "sine", vol: 0.16 });
}

// 点击喇叭：切换开关 + 持久化 + 立刻生效
function toggleMute() {
  bgmEnabled = !bgmEnabled;
  localStorage.setItem("chess_jump_mute", bgmEnabled ? "0" : "1");
  sfxClick();                  // ▶ 点击音
  vibrate(12);                 // ▶ 轻震一下
  if (bgmEnabled) {
    startBGM();
  } else {
    stopBGM();
    sfxChargeStop();     // 静音时把正在响的蓄力音也掐掉
  }
}

// 【新】根据触摸/鼠标的 x 位置算出音量比例
function updateVolumeFromX(lx) {
  let p = (lx - sliderVolume.x) / sliderVolume.w;
  p = Math.max(0, Math.min(1, p));
  masterVolume = Math.round(p * 100) / 100;        // 取两位小数，避免浮点噪音
  localStorage.setItem("chess_jump_vol", masterVolume);
  applyVolume();
}

//蓄力起跳事件（【改】结束后按下立即重开）
function pressStart(e) {
  //【修·兜底】万一玩家在游戏启动前（initGame 尚未跑过）就点击，
  //  此时 blocks 是空数组、gameStarted 为 false，直接进入蓄力会落在一个空世界里。
  //  这里补一次启动：等于「第一次点击也能把游戏唤醒」，不会再出现点了没反应。
  if (!gameStarted) { startGameOnce(); }

  // 【改】先把屏幕坐标换算成逻辑坐标，再判断点的是不是按钮；点按钮就不进入蓄力，避免误触
  const rect = canvas.getBoundingClientRect();
  let clientX = 0, clientY = 0;
  if (e && e.touches && e.touches.length) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e) {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  const scale = rect.width / GAME_W;               // 显示尺寸 → 逻辑尺寸的换算系数
  const lx = (clientX - rect.left) / scale;
  const ly = (clientY - rect.top) / scale;

  if (hitButton(btnMute, lx, ly)) {
    toggleMute();
    return;                                        // 点的是静音键，直接返回，不蓄力
  }
  // 【新】音量滑块（给一点纵向容差，手指按压不精准也能拖动）
  if (lx >= sliderVolume.x - 10 && lx <= sliderVolume.x + sliderVolume.w + 10 &&
      ly >= sliderVolume.y - 8 && ly <= sliderVolume.y + sliderVolume.h + 8) {
    draggingVolume = true;
    updateVolumeFromX(lx);
    return;                                        // 拖音量条时不蓄力
  }
  if (hitButton(btnRestart, lx, ly)) {
    sfxRestart();                                  // ▶ 重开音
    vibrate(20);                                   // ▶ 震动
    initGame();                                    // 重新开始：复位所有状态
    if (bgmEnabled) startBGM();                    // 顺手确保音乐继续（如果之前是开的）
    return;                                        // 不蓄力
  }

  // 【改】用户第一次点击是唯一合法的「解锁自动播放」时机。
  //      在交互回调里创建/唤醒 AudioContext，浏览器才会允许出声。
  ensureAudio();
  if (bgmEnabled) startBGM();

  isPress = true;
  pressTime = performance.now();
  power = 0;
  hasPlayed = true;                                // 【新】操作过了，首次提示不再显示
  sfxChargeStart();                                // ▶ 蓄力音（音高随力度上升）
}
function pressEnd() {
  if (draggingVolume) {                            // 【新】松手 = 结束拖音量
    draggingVolume = false;
    return;
  }
  if (!isPress) return;
  isPress = false;
  sfxChargeStop();                         // ▶ 停蓄力音
  let hold = performance.now() - pressTime;
  power = Math.min(hold / 50, 8);          //【修】50ms 涨 1 点，400ms 充满（8×50=400），想调手感改这里的 50 和 8
  player.vx = 1.2 + power * 0.5;           //【改】系数调到 0.5：满力跳距 ~229px，正好覆盖落点区间
  player.vy = -7.5 - power * 0.22;
  player.onGround = false;
  player.standingBlock = null;
  sfxJump(power / 8);                      // ▶ 起跳音（力度越大音越高）
  vibrate(Math.round(8 + power * 2));      // ▶ 震动：力度越大震得越久
}

//游戏更新逻辑
function update() {

  //【改】实时蓄力（与 pressEnd 保持一致：50ms 涨 1 点，上限 8，400ms 充满）
  if (isPress) {
    power = Math.min((performance.now() - pressTime) / 50, 8);
    sfxChargeUpdate(power / 8);            // ▶ 蓄力音音高实时跟随力度
  }

  //移动方块
  for (let b of blocks) {
    if (b.moveSpeed) {
      b.x += b.moveSpeed * b.direction;
      if (Math.abs(b.x - b.originX) > b.moveRange) {
        b.direction *= -1;
      }
    }
  }

  // ==========【金币】金币每帧更新（浮动 + 自转 + 拾取 + 清理）==========
  // 【金币】放在「移动方块」之后、「玩家物理」之前：这样金币位置先算好，
  //        本轮玩家位移后就能立刻做拾取判定，吃币手感最跟手。
  (function updateCoins() {
    const t = performance.now();
    // 【金币】玩家矩形（左上角坐标）—— 用「最近点夹取法」和金币圆心做碰撞
    const px0 = player.x, py0 = player.y;
    const px1 = player.x + player.w, py1 = player.y + player.h;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.collected) continue;
      // 【金币】0) 跟随所属方块：move 方块会左右平移，金币必须实时同步 x（y 不用跟，方块 y 恒为 380）
      //        —— blockId 在生成时就存了，这里按 id 找回方块即可；找不到说明方块已被裁掉（见第 3 步清理）
      const owner = blocks.find(b => b.id === c.blockId);
      if (owner) c.x = owner.x + owner.w / 2;   // 【金币】金币中心 = 方块水平中心（跟随平移）
      // 【金币】1) 上下浮动：基于固定的 bY 算，绝不拿 y 自增（否则累积漂移）
      c.y = c.bY + Math.sin(t * 0.004 + c.phase) * 5;
      // 【金币】2) 拾取判定：把金币圆心夹到玩家矩形内取最近点，算距离平方
      const nx = Math.max(px0, Math.min(c.x, px1));
      const ny = Math.max(py0, Math.min(c.y, py1));
      const dx = c.x - nx, dy = c.y - ny;
      if (dx * dx + dy * dy < COIN_RADIUS * COIN_RADIUS) {
        // 【金币】拾取成功
        c.collected = true;
        coinCountRun += 1;
        coinCount += 1;
        localStorage.setItem("chess_jump_coins", coinCount); // 【金币】累计总数持久化
        addCoinBurst(c.x, c.y);                            // 【金币】金色粒子
        addFloatingText("+1 TOKEN", c.x - 26, c.y - 8);    // 【金币】飘字
        sfxCoin();                                          // 【金币】金币声
        vibrate([0, 12]);                                   // 【金币】轻震
      }
    }
    // 【金币】3) 清理：已拾取 / 滚出屏幕左侧 / 所属方块已被裁掉 —— 三类一律剔除，防数组无限涨
    //        （所属方块没了金币还悬在空中不合理，所以用 owner 是否存在一起判定）
    coins = coins.filter(c =>
      !c.collected &&
      c.x > cameraX - 200 &&
      blocks.some(b => b.id === c.blockId)
    );
  })();

  if (player.onGround) {
    //【改】站在方块上：贴住顶面；方块移出脚下则下落
    const b = player.standingBlock;
    if (b && player.x + player.w > b.x + 6 && player.x < b.x + b.w - 6) {
      player.y = b.y - player.h;
      player.vy = 0;
      player.vx = 0;
    } else {
      player.onGround = false;
      player.standingBlock = null;
    }
  } else {
    //【改】空中：重力 + 位移，「跨过顶面」判定防穿透
    const prevBottom = player.y + player.h;
    player.vy += 0.42;
    player.x += player.vx;
    player.y += player.vy;

    for (let i = 0; i < blocks.length; i++) {
      const b = blocks[i];
      if (
        player.vy > 0 &&
        player.x + player.w > b.x + 6 &&
        player.x < b.x + b.w - 6 &&
        prevBottom <= b.y &&
        player.y + player.h >= b.y
      ) {
        player.y = b.y - player.h;
        player.vy = 0;
        player.vx = 0;
        player.onGround = true;
        player.standingBlock = b;

        //✅连击计分（【改】按用户要求简化为固定 +1：落地一次 combo+1、score+1，而非倍率加分）
        //【修】关键：用方块唯一 id 判断是否新方块，而不是数组下标 i。
        //      因为每帧末的 blocks.filter 会裁掉左侧方块，下标会整体前移，
        //      旧写法会把「跳回原方块」误判成新方块，白送连击。
        if (b.id !== lastBlockId) {
          lastBlockId = b.id;
          combo += 1;
          score += 1;
          if (score > highScore) {        // 同步刷新最高分
            highScore = score;
            localStorage.setItem("chess_jump_high", highScore);
          }
          addParticles(player.x + player.w / 2, player.y + player.h);
          addFloatingText(`+1  x${combo}`, player.x, player.y - 20);
          sfxLand();                       // ▶ 落地音
          sfxScore(combo);                 // ▶ 加分"叮"（连击越高越亮）
          vibrate([0, 18]);                // ▶ 震动：落地轻震
        } else {
          if (combo > 1) {
            addFloatingText("连击中断", player.x, player.y - 20);
            sfxComboBreak();               // ▶ 连击中断音
          }
          combo = 0;
        }
        break;
      }
    }
  }

  //掉落判定（【改】按用户要求：不弹结束画面，直接清空分数并重置回起点继续）
  if (player.y > GAME_H + 50) {
    //【修】第一步：先存最高分（顺序不能反，先清零的话 score > highScore 永远为 false）
    if (score > highScore) {
      highScore = score;
      localStorage.setItem("chess_jump_high", highScore);
    }
    //【修】第二步：复用 initGame() 做统一复位，不再手写一套重复的起手坐标，
    //       这样掉落重开和首次开始的起点位置完全一致，玩家不会感觉位置跳了一下。
    sfxFail();                             // ▶ 失败音（在 reset 之前播，避免被 initGame 影响）
    vibrate([0, 40, 60, 120]);             // ▶ 震动：失败的"顿挫"长震
    initGame();
  }
  //生成新方块（【改】跳距变小后，间距同步收窄到 55~95px，保证满力能够到）
  let last = blocks[blocks.length - 1];
  if (last && last.x < player.x + GAME_W / 2) {
    let gap = 55 + Math.random() * 40;
    blocks.push(createBlock(last.x + last.w + gap));
  }
  //清理屏幕外方块
  blocks = blocks.filter(b => b.x + b.w > cameraX - 200);
  //摄像机平滑跟随（【改】画布加宽到 520，左偏量相应调到 260，骑手保持在屏幕中间偏左）
  let targetCamX = player.x - 260;
  cameraX += (targetCamX - cameraX) * 0.06;
}

//游戏主循环
function loop() {
  update();
  drawBackground();
  for (let b of blocks) drawBlock(b);
  drawCoins();     // 【金币】金币画在方块之后、角色之前：角色会自然挡住身后的金币
  drawPlayer();
  drawParticles();
  drawFloatingTexts();
  drawChargeBar();
  drawHUD();
  drawFirstTip();  // 【新】首次进入的操作提示
  drawButtons();   // 【改】最后画 UI 按钮，保证盖在最上层不被角色/方块挡住
  requestAnimationFrame(loop);
}

//重置初始化游戏（【改】补全状态复位；【修】掉落重开也走这里，保证起手坐标唯一）
function initGame() {
  score = 0;
  combo = 0;
  power = 0;
  isPress = false;
  pressTime = 0;
  cameraX = 0;
  lastBlockId = -1;   //【修】id 从 1 开始，-1 表示「还没踩过任何方块」
  blockSeq = 0;       //【改】序号一并归零，保证每次重开方块 id 从 1 重新开始（避免长局 id 无限增大）
  blocks = [];
  particles = [];
  floatingTexts = [];
  // 【金币】金币一并复位：清空数组 + 本局计数清零（累计总数 coinCount 跨局保留，不清）
  coins = [];
  coinSeq = 0;
  coinCountRun = 0;
  blocks.push(createBlock(120));
  blocks.push(createBlock(340));
  blocks.push(createBlock(560));
  blocks[0].type = "normal";   //【改】第一块固定静止
  blocks[0].moveSpeed = 0;
  // 【金币】起点方块（id===1）本来就不会挂金币（createBlock 里已跳过），
  //        这里再兜底清一遍：确保第 1 块上方绝不出现金币（玩家开局就站上面，白送太廉价）
  coins = coins.filter(c => c.blockId !== blocks[0].id);
  //【修】统一把玩家放在第一块方块的水平中线上方一点，让他自然落地。
  //      以前掉落重置用 x=100（正好贴方块左边缘，很别扭），initGame 用 x=180，两处不一致。
  player.x = blocks[0].x + blocks[0].w / 2 - player.w / 2;
  player.y = blocks[0].y - player.h - 20;  // 方块顶面再往上 20px，自然落体到顶面
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.standingBlock = null;
}

//鼠标、触屏监听（【改】把事件对象透传下去，pressStart 里要靠坐标做按钮命中检测）
canvas.addEventListener("mousedown", (e) => pressStart(e));
canvas.addEventListener("mouseup", pressEnd);
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  pressStart(e);
});
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  pressEnd();
});

//【改】窗口尺寸变化时重算画布物理像素（内部分辨率始终按 520x600 映射）
let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(setupCanvas, 120);
});

//【修·P0】启动逻辑重写 —— 原来这里有一个「时好时坏」的致命竞态：
//
//   原始写法：
//     playerSprite.addEventListener("load", startGameOnce);
//     coinSprite.addEventListener("load", startGameOnce);
//     setTimeout(startGameOnce, 1000);      // 兜底
//
//   Bug：本文件的图片是 base64 内嵌的，解码极快。当 `src` 被赋值、图片在
//   【addEventListener 注册之前】就已经解码完成（complete === true）时，
//   `load` 事件【再也不会派发】—— 这是 HTML 规范的既定行为，不是浏览器 bug。
//
//   后果：
//     1. 只能靠那句 setTimeout(1000) 兜底 → 每次打开都要干等 1 秒；
//     2. 若这一秒内 setTimeout 因标签页后台/主线程繁忙被节流，
//        或玩家在 1 秒内就点击 → 此时 initGame() 还没跑，游戏循环也没启动，
//        pressStart 拿不到有效状态 → 【点了完全没反应】；
//     3. 更迷惑的是：第 99 行的 `playerSprite.onload` 是【另一个通道】，
//        它可能已经正常触发（spriteOK = true，角色画得出来），
//        但 addEventListener 那条通道的 startGameOnce 丢了
//        → 画面上有角色、却点不动，表现为「时好时坏」。
//
//   修法：注册监听器之后，立刻检查 `complete`，
//        若图片早已完成就【同步补一次】启动，不再依赖 load 事件。
//        另外给 onload/onerror 也挂上启动，双保险；兜底时间从 1000ms 收到 200ms。
let gameStarted = false;
function startGameOnce() {
  if (gameStarted) return;   // 只启动一次（多个通道都可能触发）
  gameStarted = true;
  initGame();
  loop();
}

//【修】统一的「补启动」助手：图片若已经完成（无论成功或失败），立刻开局。
//  这是修掉「complete 后注册 load 监听器永远收不到事件」的关键一步。
function startIfImageReady(img, onFail) {
  // 已经完成解码（缓存命中 / base64 同步解码）
  if (img && img.complete) {
    // naturalWidth === 0 表示解码失败（图坏了），否则视为成功
    if (img.naturalWidth === 0 || img.naturalHeight === 0) {
      if (onFail) onFail();
    }
    startGameOnce();
    return true;
  }
  return false;
}

// 主角图：加载成功 → 开局；失败 → 标记回退并照样开局（绝不能白屏）
playerSprite.addEventListener("load", () => { spriteOK = true; startGameOnce(); });
playerSprite.addEventListener("error", () => {
  spriteOK = false;
  console.warn("主角图片加载失败，已回退到手绘骑士");
  startGameOnce();
});
// 金币图：成功/失败都只负责把游戏拉起来（startGameOnce 内部去重）
coinSprite.addEventListener("load", startGameOnce);
coinSprite.addEventListener("error", startGameOnce);

//【修】关键补丁：注册完监听器立刻检查 —— 图片若早就好了，同步开局，不等 load
startIfImageReady(playerSprite, () => { spriteOK = false; });
startIfImageReady(coinSprite);

//【修·根治】把「游戏启动」和「图片加载」彻底解耦 —— 这是本 bug 的架构级解法。
//
//  之前的根本设计缺陷：把游戏循环的启动【挂在图片的 load 事件上】。
//  但图片只是「有就用、没有就手绘回退」的【可选】资源
//  （drawPlayer 里本来就有 spriteOK 分支做回退），
//  让它来决定游戏能不能开始，是把可选依赖错当成了必需依赖。
//
//  正确做法：只要脚本执行到这里，就说明 DOM 和全部函数都已就绪，
//  立刻启动游戏循环。图片晚一点好，角色第一帧走手绘、之后自动切成贴图，
//  玩家完全感知不到，也永远不会出现「点了没反应」。
//
//  下面三重保险，只要任意一个先到就开局：
//    ① requestAnimationFrame：浏览器下一帧（通常 16ms 内，最快）
//    ② setTimeout(0)：宏任务兜底
//    ③ setTimeout(200)：极端情况的最终兜底
if (!gameStarted) {
  requestAnimationFrame(() => { if (!gameStarted) startGameOnce(); });
  setTimeout(startGameOnce, 0);
  setTimeout(startGameOnce, 200);
}

//【修】最后一道保底：页面完全加载后若仍未启动，强制开局。
window.addEventListener("load", () => { startGameOnce(); });


</script>
</body>
